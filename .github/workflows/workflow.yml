name: Build and Datagen

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  datagen:
    runs-on: ubuntu-latest
    concurrency:
      group: datagen-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

  datagen-and-build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Configure Gradle permissions
        run: chmod +x ./gradlew

      - name: Restore build outputs cache
        id: build-cache
        uses: actions/cache@v4
        with:
          path: |
            common/build
            fabric/build
            neoforge/build
          key: build-outputs-${{ github.sha }}
          restore-keys: |
            build-outputs-

      - name: Generate data (NeoForge + Fabric)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew --no-daemon --stacktrace :neoforge:runData :fabric:runDatagen

      - name: Build (Fabric + NeoForge)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          ./gradlew --no-daemon --stacktrace :fabric:build :neoforge:build

      - name: Upload build artifacts for cross-workflow usage
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            fabric/build/libs/**
            neoforge/build/libs/**
            common/build/libs/**
