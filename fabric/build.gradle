plugins {
    id 'com.gradleup.shadow'
}

def generatedResources = file("src/generated")

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
fabricApi {
    configureDataGeneration()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

remapJar {
    input.set shadowJar.archiveFile
}

modrinth {
    token = env.MODRINTH_TOKEN.value // Remember to have the MODRINTH_TOKEN environment variable set or else this will fail - just make sure it stays private!
    projectId = rootProject.mod_id
    versionNumber = rootProject.mod_version
    versionType = rootProject.mod_version_type
    changelog = rootProject.file("changelogs/${rootProject.mod_version}.md").text
    uploadFile = remapJar // With Loom, this MUST be set to `remapJar` instead of `jar`!
    gameVersions = [rootProject.minecraft_version] // Must be an array, even with only one version
    loaders = ["fabric"] // Must also be an array - no need to specify this if you're using Loom or ForgeGradle
    dependencies { // A special DSL for creating dependencies
        // scope.type
        // The scope can be `required`, `optional`, `incompatible`, or `embedded`
        // The type can either be `project` or `version`
        required.project "fabric-api" // Creates a new required dependency on Fabric API
        required.project "architectury-api"
    }
}

curseforge {
    apiKey = env.CURSEFORGE_TOKEN.value
    project {
        id = rootProject.mod_curseforge_id
        changelogType = 'markdown'
        changelog = rootProject.file("changelogs/${rootProject.mod_version}.md").text
        releaseType = 'release'

        addGameVersion rootProject.minecraft_version
        addGameVersion 'Fabric'

        relations {
            requiredDependency 'architectury-api'
            requiredDependency 'fabric-api'
        }

        afterEvaluate {
            mainArtifact(remapJar) {
                displayName = "$rootProject.archives_name-$project.name-$project.minecraft_version"
            }
            uploadTask.dependsOn(remapJar)
        }
    }
    options {
        forgeGradleIntegration = false
    }
}