plugins {
    id 'com.gradleup.shadow'
}

def generatedResources = file("src/generated")
def assets = rootProject.project('common').file('src/main/resources')

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

remapJar {
    input.set shadowJar.archiveFile
}

loom {
    runs {
        data {
            data()
            programArgs(
                    '--mod', 'moanimals',
                    '--all',
                    '--output', generatedResources.absolutePath,
                    '--existing', assets.getAbsolutePath(),
                    '--existing', file("src/main/resources").getAbsolutePath(),
                    '--existing-mod', 'moanimals'
            )

        }
    }
}

publishMods {
    file = remapJar.archiveFile
    displayName = "$rootProject.archives_name-$project.name-$project.minecraft_version"
    changelog = rootProject.file("changelogs/${rootProject.mod_version}.md").text

    type = STABLE
    modLoaders.add("neoforge")

    dryRun = false

    curseforge {
        projectId = rootProject.mod_curseforge_id
        accessToken = env.CURSEFORGE_TOKEN.value

        minecraftVersions.add(rootProject.minecraft_version)

        client = true
        server = true

        requires("architectury-api")
    }

    modrinth {
        projectId = rootProject.mod_id
        accessToken = env.MODRINTH_TOKEN.value

        minecraftVersions.add(rootProject.minecraft_version)

        environment = CLIENT_AND_SERVER

        requires("architectury-api")
    }
}